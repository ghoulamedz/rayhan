name: Deploy Frontend

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Build Demo
        run: |
          cd frontend
          flutter pub get
          flutter build web --release \
            --dart-define=USE_MOCK=true \
            --base-href=/rayhan/ \
            --output=build/demo
          cp build/demo/index.html build/demo/404.html

      - name: Build Prod
        run: |
          cd frontend
          flutter build web --release \
            --dart-define=USE_MOCK=false \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --base-href=/rayhan/prod/ \
            --output=build/prod
          cp build/prod/index.html build/prod/404.html

      - name: Combine Artifacts
        run: |
          mkdir -p frontend/build/pages/prod
          cp -r frontend/build/demo/* frontend/build/pages/
          cp -r frontend/build/prod/* frontend/build/pages/prod/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build/pages

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
